<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thing-sona cover artwork</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;font-family:Arial,Helvetica,sans-serif}
.scene{position:relative;width:1600px;height:900px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.horizon{position:absolute;width:740px;height:740px;border:2px dashed #ced3c8;border-radius:50%;left:430px;top:80px}
.field{position:absolute;inset:125px 310px 110px;opacity:.6;background-image:radial-gradient(#ccd2c5 1.6px,transparent 1.6px);background-size:30px 30px;mask-image:radial-gradient(ellipse,#000 0%,transparent 72%)}
.pair{display:flex;gap:68px;align-items:center;margin-top:-32px;z-index:1}
.card{width:360px;padding:24px;border-radius:23px;color:white;text-align:center;box-shadow:0 35px 70px #29342014}
.how{background:#fb365b;transform:translateY(14px) rotate(-10deg)}.who{background:#0854ed;transform:translateY(-8px) rotate(-10deg)}
.deck{font-size:22px;font-weight:700;letter-spacing:3px;margin:3px 0 23px}
.picture{background:white;border-radius:12px;width:312px;height:280px;display:flex;align-items:center;justify-content:center}
.picture img{width:245px;height:245px;object-fit:contain}
.name{font-size:35px;font-weight:750;margin-top:22px;line-height:1.15}
.description{font-size:21px;line-height:1.4;margin:9px 0 4px}
.caption{position:absolute;bottom:78px;width:100%;text-align:center;color:#737b70;font-size:22px;letter-spacing:1.5px}
</style>
</head>
<body>
<main class="scene" aria-label="HOW and WHO cards: Dependable and Helper">
<div class="horizon"></div><div class="field"></div>
<div class="pair">
<article class="card how"><div class="deck">HOW</div><div class="picture"><img src="dependable.png" alt="Mechanical arm"></div><div class="name">Dependable</div><div class="description">I can count on it.</div></article>
<article class="card who"><div class="deck">WHO</div><div class="picture"><img src="helper.png" alt="Helper"></div><div class="name">Helper</div><div class="description">It helps me do things.</div></article>
</div>
<div class="caption">HOW + WHO → A situated relational narrative</div>
</main>
</body></html>
